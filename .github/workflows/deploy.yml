name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_REGION != '' }}
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: autodeploy-lab
      ECS_SERVICE_NAME: autodeploy-lab
      EXECUTION_ROLE_NAME: ecsTaskExecutionRole
      INFRASTRUCTURE_ROLE_NAME: ecsInfrastructureRoleForExpressServices

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run lint checks
        run: ruff check .

      - name: Run tests
        run: pytest -q

      - name: Install AWS CLI v2
        run: |
          curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o awscliv2.zip
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActionsAutoDeployLab

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --pull -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Create or update ECS Express Mode service
        id: deploy
        run: |
          EXECUTION_ROLE_ARN="arn:aws:iam::$(
            aws sts get-caller-identity --query Account --output text
          ):role/$EXECUTION_ROLE_NAME"
          INFRASTRUCTURE_ROLE_ARN="arn:aws:iam::$(
            aws sts get-caller-identity --query Account --output text
          ):role/$INFRASTRUCTURE_ROLE_NAME"

          CLUSTER_ARN="$(aws ecs describe-clusters \
            --clusters default \
            --query 'clusters[?status==`ACTIVE`].clusterArn | [0]' \
            --output text)"

          SERVICE_ARN="None"
          if [[ "$CLUSTER_ARN" != "None" && -n "$CLUSTER_ARN" ]]; then
            SERVICE_ARN="$(aws ecs list-services \
              --cluster "$CLUSTER_ARN" \
              --query "serviceArns[?contains(@, '/$ECS_SERVICE_NAME')]|[0]" \
              --output text)"
          fi

          if [[ "$SERVICE_ARN" == "None" || -z "$SERVICE_ARN" ]]; then
            echo "Creating ECS Express Mode service..."
            aws ecs create-express-gateway-service \
              --service-name "$ECS_SERVICE_NAME" \
              --cluster default \
              --execution-role-arn "$EXECUTION_ROLE_ARN" \
              --infrastructure-role-arn "$INFRASTRUCTURE_ROLE_ARN" \
              --primary-container "image=$IMAGE_URI,containerPort=5000" \
              --health-check-path /health \
              --cpu 256 \
              --memory 512 \
              --scaling-target minTaskCount=1,maxTaskCount=1 \
              --monitor-resources DEPLOYMENT \
              --monitor-mode TEXT-ONLY > deployment.json
            SERVICE_ARN="$(jq -r '.service.serviceArn' deployment.json)"
          else
            echo "Updating existing ECS Express Mode service..."
            aws ecs update-express-gateway-service \
              --service-arn "$SERVICE_ARN" \
              --primary-container "image=$IMAGE_URI,containerPort=5000" \
              --health-check-path /health \
              --monitor-resources DEPLOYMENT \
              --monitor-mode TEXT-ONLY > deployment.json
          fi

          if [[ -z "$SERVICE_ARN" || "$SERVICE_ARN" == "null" ]]; then
            echo "Could not resolve the ECS Express Mode service ARN." >&2
            cat deployment.json
            exit 1
          fi

          echo "SERVICE_ARN=$SERVICE_ARN" >> "$GITHUB_OUTPUT"

      - name: Verify deployment and publish URL
        env:
          SERVICE_ARN: ${{ steps.deploy.outputs.SERVICE_ARN }}
        run: |
          ENDPOINT="$(aws ecs describe-express-gateway-service \
            --service-arn "$SERVICE_ARN" \
            --query 'service.activeConfigurations[0].ingressPaths[0].endpoint' \
            --output text)"

          if [[ -z "$ENDPOINT" || "$ENDPOINT" == "None" ]]; then
            echo "ECS did not return a public endpoint. Check the service in the ECS console." >&2
            exit 1
          fi

          if [[ "$ENDPOINT" != https://* ]]; then
            ENDPOINT="https://$ENDPOINT"
          fi

          curl --fail --silent --show-error \
            --retry 18 --retry-delay 10 --retry-connrefused \
            "$ENDPOINT/health"

          {
            echo "## Deployment complete"
            echo
            echo "- Service: `$ECS_SERVICE_NAME`"
            echo "- Region: `$AWS_REGION`"
            echo "- Health check: `$ENDPOINT/health`"
            echo "- Application: $ENDPOINT"
            echo "- Image: `$IMAGE_URI`"
          } >> "$GITHUB_STEP_SUMMARY"

  setup-required:
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN == '' || vars.AWS_REGION == '' }}
    name: AWS setup required
    runs-on: ubuntu-latest
    steps:
      - name: Explain required configuration
        run: |
          {
            echo "## AWS deployment is not configured"
            echo
            echo "Run `scripts/bootstrap-aws.sh` from AWS CloudShell, then add the `AWS_REGION` and `AWS_DEPLOY_ROLE_ARN` repository variables in GitHub Settings."
            echo "No AWS credentials or cloud resources were created by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
